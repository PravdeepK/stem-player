# The same fields as Help › Request a Feature… in the app, which also prefills
# this form (by field id) when it can't post the issue itself.
name: Feature request
description: An idea for something Stem Player could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Easiest from the app: **Help › Request a Feature…**. This is posted publicly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What it would do, and how it would help.
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: System info
      description: Optional. App version, macOS version, chip and memory, if they matter for the idea.
    validations:
      required: false
