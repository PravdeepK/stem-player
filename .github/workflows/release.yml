name: Release

# Push a tag like v0.2.0 (matching "version" in package.json) to build the
# Apple silicon zip and publish it as a GitHub release. install.sh downloads
# releases/latest/download/Stem-Player-mac-arm64.zip, so the asset name is fixed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIP: dist/Stem-Player-mac-arm64.zip
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  release:
    name: Build and publish the macOS arm64 zip
    # Apple silicon runner; Stem Player has no Intel build.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # runs as bash -eo pipefail, so piped commands fail properly
    steps:
      - uses: actions/checkout@v7

      - name: Check the runner is Apple silicon
        run: test "$(uname -m)" = arm64

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version (expected v$version)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build the trackpad haptics addon
        run: npm run build:native

      # The icons are committed, so this skips `npm run icons` (and the
      # Playwright Chromium it needs) and runs the rest of release:mac.
      - name: Build the release zip
        run: npm run release:zip

      - name: Verify the zip
        run: |
          out="$RUNNER_TEMP/verify"
          rm -rf "$out"
          ditto -x -k "$ZIP" "$out"
          app="$out/Stem Player.app"
          test -d "$app" || { echo "::error::$ZIP doesn't contain Stem Player.app"; exit 1; }

          codesign -dv "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q '^Signature=adhoc$' "$RUNNER_TEMP/codesign.txt" || { echo "::error::the app isn't ad-hoc signed"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"

          haptics="$app/Contents/Resources/app/native/haptics/build/Release/haptics.node"
          test -f "$haptics" || { echo "::error::haptics.node is missing from the app"; exit 1; }
          test "$(lipo -archs "$haptics")" = arm64
          test "$(lipo -archs "$app/Contents/MacOS/Stem Player")" = arm64
          ls -l "$ZIP"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag with a suffix (v0.2.0-beta.1) becomes a prerelease, which
          # releases/latest (and so install.sh) skips.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "Stem Player $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
