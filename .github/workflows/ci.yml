name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and renderer build
    # The unit tests and the Next.js export are plain Node, so Linux is enough.
    # Packaging and the native addon are covered on macOS by release.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nothing here launches Electron, so skip its ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run next:build
